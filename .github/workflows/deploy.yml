name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify Gemini API key secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing or empty. In repo Settings → Secrets and variables → Actions, set GEMINI_API_KEY to your key from https://aistudio.google.com/apikey"
            exit 1
          fi
          echo "GEMINI_API_KEY is set (${#GEMINI_API_KEY} characters)"

      - name: Build static site
        run: npm run build

      - name: Verify API key baked into client bundle
        run: |
          if grep -rq 'AI is not configured' out/_next/static/chunks/ && \
             grep -rq 'NEXT_PUBLIC_GEMINI_API_KEY??""' out/_next/static/chunks/; then
            echo "::error::NEXT_PUBLIC_GEMINI_API_KEY was not inlined. Update GEMINI_API_KEY and redeploy."
            exit 1
          fi
          echo "API key successfully inlined into client bundle."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
